<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { background: #1a1a1a; color: white; font-family: sans-serif; text-align: center; }
        .game-grid { 
            display: grid; 
            grid-template-columns: 1fr 1fr; 
            gap: 15px; padding: 20px; 
        }
        .game-card { 
            background: #333; border-radius: 15px; padding: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            text-decoration: none; color: white;
            display: block; /* Link ဖြစ်လို့ block ပြောင်းထားတာပါ */
        }
        .game-card img { width: 100%; border-radius: 10px; height: 100px; object-fit: cover; }
        .game-card h3 { margin: 10px 0 0; font-size: 14px; }
        
        /* ရှမ်းကိုးမီးအတွက် အထူး Card ဒီဇိုင်း (Buffalo Style) */
        .shan-card {
            background: linear-gradient(145deg, #8b4513, #5d2e0a) !important;
            border: 2px solid #ffd700;
        }
        .buffalo-icon { font-size: 40px; margin: 10px 0; }
    </style>
</head>
<body>
    <h1>Mini Game Hub</h1>
    <div class="game-grid">
        <a href="game.html" class="game-card shan-card">
            <div class="buffalo-icon">🐂</div>
            <h3>Shan Koe Mee</h3>
            <small style="color: #ffd700;">Buffalo Edition</small>
        </a>

        <a href="wheel.html" class="game-card">
            <img src="https://iili.io/fyre0ga.th.png" alt="Spin">
            <h3>Fruit Spin</h3>
        </a>

        <div class="game-card"><h3>Lucky Dice</h3></div>
        <div class="game-card"><h3>Guess Number</h3></div>
        <div class="game-card"><h3>Coin Flip</h3></div>
    </div>
</body>
</html>
